name: voice_to_voice
description: "VoxBridge - multilingual voice-to-voice translator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  flutter_screenutil: ^5.9.3
  easy_localization: ^3.0.8
  record: ^7.1.2
  just_audio: ^0.10.6
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  shimmer: ^4.0.0
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  http_parser: ^4.1.2
  shared_preferences: ^2.5.6
  flutter_native_splash: ^2.4.8
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: assets/branding/app_icon_background.png
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter_native_splash:
  color: "#050C14"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#050C14"
    image: assets/branding/splash_logo.png
  ios: true
  android: true
  web: false
